<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Turkish research universities — Scientometrics</title><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap' rel='stylesheet'><style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#17212b;--ink2:#52606d;--mut:#7b8794;
 --border:#dce3e9;--navy:#17324d;--navy2:#24557a;--teal:#2f948b;--amber:#b97918;
 --amber-soft:#fff1d6;--blue-xl:#dceaf3;--r:12px;}
*{box-sizing:border-box;}
body{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;margin:0;
 background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;}
.wrap{max-width:920px;margin:0 auto;padding:52px 22px 64px;}
.eyebrow{color:var(--teal);font-size:12px;font-weight:600;letter-spacing:.12em;
 text-transform:uppercase;}
h1{font-size:30px;margin:5px 0 10px;font-weight:700;}
.lead{color:var(--ink2);font-size:17px;max-width:700px;margin:0 0 32px;}
.crumb{font-size:13px;color:var(--mut);margin:0 0 18px;}
.crumb a{color:var(--navy2);text-decoration:none;} .crumb a:hover{text-decoration:underline;}
.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.card{display:block;background:var(--card);border:1px solid var(--border);
 border-left:4px solid var(--teal);border-radius:var(--r);padding:20px 22px;
 text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(23,50,77,.10);}
.card h2{font-size:18px;margin:0 0 6px;color:var(--navy);}
.card p{margin:0;color:var(--ink2);font-size:14px;}
.card .method{display:inline-block;margin-top:12px;padding:2px 8px;border-radius:12px;
 background:var(--blue-xl);color:var(--navy2);font-size:10.5px;font-weight:600;
 letter-spacing:.02em;}
.card .go{display:block;margin-top:13px;font-size:13px;font-weight:600;
 color:var(--navy2);}
.views{margin:11px 0 0;padding:0;list-style:none;font-size:13px;color:var(--mut);}
.views li{display:inline-block;margin:0 12px 0 0;}
.views a{color:var(--navy2);text-decoration:none;}
.views a:hover{text-decoration:underline;}
footer{color:var(--mut);font-size:12px;margin-top:44px;}
.disc{background:var(--amber-soft);border:1px solid #efd9a7;color:var(--amber);
 padding:2px 10px;border-radius:6px;display:inline-block;}
</style></head><body><div class='wrap'><div class='crumb'><a href='../'>← All dashboards</a></div><div class='eyebrow'>Scientometrics</div><h1>Turkish research universities</h1><p class='lead'>In preparation.</p><footer><span class='disc'>Personal research project — <b>not</b> an official TÜBİTAK, ULAKBİM or YÖK website.</span> · data: Scopus · Web of Science · OpenAIRE · SCImago SJR · <a href='https://sbilmis.org'>Selçuk Bilmiş</a></footer></div></body></html>
