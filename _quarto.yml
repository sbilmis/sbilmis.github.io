project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "publications/**/*.qmd"
    - "tools/*.qmd"
    - "tutorials/**/*.qmd"
    - "blog/*.qmd"
  post-render:
    - python3 scripts/preserve-legacy.py
  resources:
    - .nojekyll

website:
  title: "Selçuk Bilmiş"
  site-url: "https://sbilmis.org"
  description: "A physicist's public notebook: physics, computing, research workflows, and things worth remembering."
  favicon: assets/favicon-sb.svg
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  open-graph:
    image: assets/social-card.png
  twitter-card:
    image: assets/social-card.png
    card-style: summary_large_image
  navbar:
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: tutorials/index.qmd
        text: Tutorials
      - href: blog/index.qmd
        text: Blog
      - href: tools/index.qmd
        text: Tools
      # Static dashboards under archive/legacy-site/scientometrics/, copied
      # into _site/ by scripts/preserve-legacy.py. Not a .qmd, so it is linked
      # by path — without this entry the work is reachable only by someone who
      # already has the URL.
      - href: /scientometrics/
        text: Scientometrics
      - href: about.qmd
        text: About
    right:
      - icon: envelope
        href: mailto:sbilmis@metu.edu.tr
        aria-label: Email
      - icon: github
        href: https://github.com/sbilmis
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/selcuk-bilmis-06781288/
        aria-label: LinkedIn
  page-footer:
    left: "physicist... notes to myself..."

format:
  html:
    theme:
      light: [cosmo, styles.scss, _rules.scss]
      dark: [darkly, styles-dark.scss, _rules.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true

execute:
  freeze: auto
